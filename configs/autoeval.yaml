autoeval:
  # Evaluates on the held-out test split defined under `dataset` in config.yaml
  num_samples: 80                    # limit for speed
  max_new_tokens: 256                # Bitext answers are paragraph-length
  # Score is ROUGE-L F1 (0-1); the drift thresholds below are drops in this score
  enable: true
  save_reference: true

drift:
  enable: true
  accuracy_drop_threshold: 0.05      # warning threshold
  retrain_threshold: 0.10             # hard retrain trigger
  auto_retrain: true                  # enable retraining

scheduler:
  run_after_training: true
  run_daily: false
  run_weekly: true
