# configs/config.yaml

# Model Configuration
model:
  # CRITICAL: Mistral 7B requires ~6GB VRAM. 
  # We switched to Phi-3-mini (3.8B) which fits your 4GB RTX 3050.
  # Pre-quantized 4-bit weights: ~2.3GB download instead of ~7.6GB fp16
  base_model: "unsloth/Phi-3-mini-4k-instruct-bnb-4bit"
  # base_model: "unsloth/gemma-2b-it-bnb-4bit" # Alternative ultra-light option
  max_seq_length: 1024 # Reduced from 2048 to save VRAM
  dtype: null 
  load_in_4bit: True

# LoRA Configuration
lora:
  r: 16
  lora_alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0
  bias: "none"
  use_gradient_checkpointing: True
  use_rslora: False
  loftq_config: null

# Dataset Configuration
dataset:
  # PakWheels customer-support demo (build it with scripts/build_pakwheels_dataset.py).
  # A local .jsonl/.json/.csv file with instruction/response (and optional context) columns.
  path: "data/pakwheels/pakwheels_support.jsonl"
  # To train on the original Bitext dataset instead, use:
  # path: "bitext/Bitext-customer-support-llm-chatbot-training-dataset"
  # revision: "430d1a89bd93bd1fa23c16f29dd53e73f0087443"   # Hub commit, pinned
  revision: null        # only used for Hub datasets
  # Neither source has a test split; a held-out test set is carved out of it.
  # Keep these fixed so the test set never leaks into training.
  # Local files: number of held-out QUESTIONS (all their rows, ~80 for PakWheels).
  # Hub datasets: number of rows (use 500 for Bitext).
  test_size: 50
  split_seed: 42

# RAG Retrieval (deployment/app.py, scripts/evaluate.py)
rag:
  # Knowledge base indexed at startup; one chunk per "## " section
  documents:
    - "data/pakwheels/knowledge_base.md"
  # 2 sections (~250 tokens) leave room for chat history in the 1024-token window
  top_k: 2
  # Min cosine similarity for a chunk to be used as context. PROVISIONAL for the
  # PakWheels knowledge base: re-measure with scripts/measure_rag_threshold.py
  # (in-scope questions should clear it, off-topic ones should not).
  min_similarity: 0.36

# Training Arguments
training:
  per_device_train_batch_size: 1  # MUST be 1 for 4GB VRAM
  gradient_accumulation_steps: 8  # Increased to 8 to compensate for batch size 1
  warmup_steps: 5
  max_steps: 285   # ~2 epochs of the 1128-row PakWheels v7 train split (8 rows/step)
  learning_rate: 0.0002
  fp16: False 
  bf16: True       # RTX 3050 supports BF16 (Ampere), better stability than FP16
  logging_steps: 1
  optim: "paged_adamw_8bit" # CRITICAL: Offloads optimizer state to RAM if VRAM full
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 42
  output_dir: "./outputs"
  push_to_hub: True # Ensure you have HUGGING_FACE_TOKEN in .env

# MLflow Configuration
mlflow:
  experiment_name: "SLM_FineTuning_Experiments"
  # run_name: "phi-3-mini-customer-support"
  run_name: "phi-3-mini-pakwheels-support" 

# Deployment Configuration
deployment:
  # hf_hub_repo: "jawadahmadansari/SLM-fine-tuned-model-local"
  hf_hub_repo: "jawadahmadansari/pakwheels-support-phi3-lora"
  # Previous user/assistant exchanges sent to the model. Training rows have at
  # most 2; longer chats made the model copy earlier, unrelated answers.
  max_history_turns: 2